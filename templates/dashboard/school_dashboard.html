{% extends "base/base.html" %}

{% block title %}
School Dashboard
{% endblock %}

{% block content %}

<h2 class="mb-4">

    School Dashboard

</h2>

<div class="row">

    <div class="col-md-3">

        <div class="card shadow-sm">

            <div class="card-body">

                <h6>Total Students</h6>

                <h2>
                    {{ total_students }}
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card shadow-sm">

            <div class="card-body">

                <h6>Total Employees</h6>

                <h2>
                    {{ total_employees }}
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card shadow-sm">

            <div class="card-body">

                <h6>Total Teachers</h6>

                <h2>
                    {{ total_teachers }}
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card shadow-sm">

            <div class="card-body">

                <h6>Class Sections</h6>

                <h2>
                    {{ total_sections }}
                </h2>

            </div>

        </div>

    </div>

</div>

{% endblock %}
