{% load static %}
<!DOCTYPE html>
<html>
<head>

    <title>CampusIQ Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>
<body class="bg-light">

<div class="container">

    <div class="row vh-100 align-items-center justify-content-center">

        <div class="col-md-4">

            <div class="card shadow border-0">

                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <h2>
                            CampusIQ™
                        </h2>

                        <p class="text-muted">
                            Sign in to continue
                        </p>

                    </div>

                    <form method="post">

                        {% csrf_token %}

                        {{ form.username.label_tag }}
                        {{ form.username }}

                        <br>

                        {{ form.password.label_tag }}
                        {{ form.password }}

                        <br>

                        <button
                            class="btn btn-primary w-100"
                            type="submit"
                        >
                            Login
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
